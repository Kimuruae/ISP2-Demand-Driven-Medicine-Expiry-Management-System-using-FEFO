{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
    {% if page_obj.has_previous %}
        <a class="btn btn-outline btn-sm" href="?{{ query_string }}page={{ page_obj.previous_page_number }}">&lsaquo; Previous</a>
    {% endif %}
    <span class="muted-text">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a class="btn btn-outline btn-sm" href="?{{ query_string }}page={{ page_obj.next_page_number }}">Next &rsaquo;</a>
    {% endif %}
</nav>
{% endif %}
